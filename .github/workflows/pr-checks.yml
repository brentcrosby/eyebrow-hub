name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every database below is a throwaway container, never a real database. No
  # real secrets are used by these checks.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"
  # The database tests only accept these exact addresses, so they can never
  # reach the shared team database.
  DT524_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:55432/dt524_test
  DT571_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:55433/dt571_test
  DT_SPRINT09_TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:55434/sprint09_test

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Four empty databases, thrown away when the job ends. `postgres` is for the
    # build; the other three are the fixed addresses the database tests require
    # (limiter tests, Mosab's reservation tests, Mosab's recovery test).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dt524:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dt524_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dt571:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dt571_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      sprint09:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sprint09_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Applies the committed migrations in order, the way a real release will,
      # so a broken or missing migration fails here instead of in production.
      # migrate deploy has no --url option, so the address is set on this step:
      # it can only reach the throwaway database above.
      - name: Apply committed migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma migrate deploy

      # migrate deploy only runs the migration files and never compares them to
      # schema.prisma. This fails the job (exit code 2) if the schema was changed
      # without a matching migration.
      - name: Check schema matches migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # The database tests need the same tables a release has.
      - name: Apply migrations to the test databases
        run: |
          for url in "$DT524_TEST_DATABASE_URL" "$DT571_TEST_DATABASE_URL" "$DT_SPRINT09_TEST_DATABASE_URL"; do
            DATABASE_URL="$url" npx prisma migrate deploy
          done

      - name: Build
        run: npm run build

      # The limiter HTTP test sends real requests through the DT-524 proxy to the
      # built app, the same way a deployment's ingress does. The secret is made
      # fresh for this run and never stored.
      - name: Start the app behind the local proxy
        run: |
          secret="$(openssl rand -hex 32)"
          # Later steps (the tests) need the same values as the app.
          echo "BOOKING_RATE_LIMIT_SECRET=$secret" >> "$GITHUB_ENV"
          echo "BOOKING_CLIENT_IP_HEADER=x-trusted-client-ip" >> "$GITHUB_ENV"
          DATABASE_URL="$DT524_TEST_DATABASE_URL" BOOKING_RATE_LIMIT_SECRET="$secret" \
            BOOKING_CLIENT_IP_HEADER=x-trusted-client-ip \
            nohup npx next start --hostname 127.0.0.1 --port 3101 > app.log 2>&1 &
          nohup node scripts/dt524-local-proxy.mjs > proxy.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::The app did not become healthy behind the proxy"
          exit 1

      # Every test file, including the database and limiter-HTTP tests. Files run
      # one at a time because the reservation tests share one salon-wide
      # database. A skipped test is not a pass: any skip fails this step.
      - name: Test
        env:
          DT524_HTTP_TEST: "1"
        run: |
          set -o pipefail
          node --experimental-strip-types --disable-warning=ExperimentalWarning \
            --test --test-concurrency=1 --test-reporter=tap "tests/**/*.test.mjs" | tee test-results.tap
          grep -q '^# fail 0$' test-results.tap
          if ! grep -q '^# skipped 0$' test-results.tap; then
            grep -E '# SKIP' test-results.tap || true
            echo "::error::Some tests were skipped. The release gate needs every test to run."
            exit 1
          fi

      - name: Show app and proxy logs
        if: failure()
        run: |
          echo "--- app.log"; cat app.log 2>/dev/null || true
          echo "--- proxy.log"; cat proxy.log 2>/dev/null || true

  # Separate job so a lint problem shows on its own instead of hiding whether
  # tests and build passed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
