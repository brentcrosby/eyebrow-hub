name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Points at the throwaway Postgres below, never a real database. No real
  # secrets are used by these checks.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The homepage reads business hours from the database while it is
    # pre-rendered at build time, so the build needs a database to talk to.
    # This one is empty and is thrown away when the job ends.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test
        run: npm test

      # --url pins this to the throwaway database above, so it can never
      # write to any other database.
      - name: Create empty database schema
        run: npx prisma db push --url postgresql://ci:ci@localhost:5432/ci

      - name: Build
        run: npm run build

  # Separate job so the known lint failure (see tests/README.md) shows on its
  # own instead of hiding whether tests and build passed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
